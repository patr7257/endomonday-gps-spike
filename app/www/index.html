<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPS Spike</title>
<style>
body{font-family:-apple-system,sans-serif;margin:0;padding:16px;padding-top:48px}
button{font-size:18px;padding:10px 14px;margin:4px 4px 4px 0}
pre,textarea{width:100%;box-sizing:border-box;font-size:12px}
textarea{height:140px}
</style>
</head>
<body>
<h3>GPS Spike</h3>
<div>
<button id="start">Start</button>

</div>
<p>Running: <b id="running">no</b> | Points: <b id="count">0</b></p>
<pre id="stats"></pre>
<textarea id="out" placeholder="Export JSON appears here"></textarea>
<script src="app.js"></script>
</body>
</html>
